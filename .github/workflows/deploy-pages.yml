name: Deploy do GitHub Pages (mirror)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build i publikacja na refinico.github.io
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://refinico.github.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalacja zależności
        run: npm ci

      - name: Build Astro
        run: npm run build

      - name: Publikacja na GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.PAGES_DEPLOY_KEY }}
          external_repository: refinico/refinico.github.io
          publish_branch: gh-pages
          publish_dir: ./dist
          keep_files: false
