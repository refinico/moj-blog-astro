name: Deploy do GitHub Pages (mirror)

on:
  # Bezpośrednie commity na main
  push:
    branches: [main]
  # Merge PR-a do main — deploy dopiero po zamknięciu i scaleniu
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Push i pull_request.closed przychodzą prawie jednocześnie przy merge'u —
# anulowanie w toku zapobiega podwójnej publikacji tego samego commita.
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build i publikacja na agentpmo.pl (GitHub Pages)
    runs-on: ubuntu-latest
    # Ignoruj PR-y zamknięte bez merge'a oraz PR-y z forków (brak sekretów).
    if: >
      github.event_name != 'pull_request' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == 'main' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    env:
      SITE_URL: https://agentpmo.pl
      PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}
    steps:
      - name: Checkout (stan po merge'u, tj. main)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalacja zależności
        run: npm ci

      - name: Build Astro
        run: npm run build

      - name: Publikacja na GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.PAGES_DEPLOY_KEY }}
          external_repository: refinico/refinico.github.io
          publish_branch: gh-pages
          publish_dir: ./dist
          keep_files: false
